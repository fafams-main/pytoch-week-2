[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-failure-prediction"
version = "0.1.0"
description = "APS Failure Prediction using PyTorch"
requires-python = ">=3.12"
dependencies = [
    "torch==2.14.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]

[tool.reproduce]
train_smoke = [
    "-m", "model.cli",
    "--smoke"
]

evaluate = [
    "-m", "model.cli",
    "--evaluate",
    "--checkpoint", "{checkpoint}",
    "--metrics-out", "{metrics_out}"
]

checkpoint_url = "https://github.com/fafams-main/pytorch-week-2/releases/download/0.0.0.1/best_model_42.pth"
metric_name = "average_precision"
metric_value = 0.8220  
tolerance = 0.02